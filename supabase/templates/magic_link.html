<!-- Passwordless email-OTP sign-in code (email-otp-auth / S-06). -->
<!-- {{ .Token }} is the 6-digit one-time code; {{ .ConfirmationURL }} is kept as a fallback link. -->
<div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #0f172a;">
  <h1 style="font-size: 20px; margin: 0 0 8px;">Sign in to Ultra Planner</h1>
  <p style="margin: 0 0 16px; color: #475569;">Enter this code to finish signing in. It expires in 1 hour.</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 0 0 16px; color: #4f46e5;">{{ .Token }}</p>
  <p style="margin: 0; font-size: 13px; color: #94a3b8;">If you didn't request this, you can ignore this email.</p>
</div>
