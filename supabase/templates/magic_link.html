<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f5; padding: 32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 12px; padding: 40px;">
            <tr>
              <td>
                <h1 style="margin: 0 0 8px; font-size: 20px; color: #18181b;">Sign in to Ultra Planner</h1>
                <p style="margin: 0 0 24px; font-size: 14px; color: #71717a;">
                  Enter this 6-digit code to finish signing in. It expires in 1 hour.
                </p>
                <div style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #18181b; background-color: #f4f4f5; border-radius: 8px; padding: 16px; text-align: center;">
                  {{ .Token }}
                </div>
                <p style="margin: 24px 0 0; font-size: 12px; color: #a1a1aa;">
                  If you didn't request this code, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
